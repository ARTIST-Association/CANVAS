{% load static django_vite %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CANVAS Editor – {{ project_name }}</title>
        <link rel="icon"
              href="{% static 'img/logo_canvas_round.svg' %}"
              type="image/x-icon">
        {% vite_hmr_client %}
        {% vite_asset 'frontend/src/main.ts' %}
    </head>
    <body>
        {# Ensures the csrftoken cookie is set for the autosave API. #}
        <form hidden>{% csrf_token %}</form>
        <div id="editor-root" data-project-id="{{ project_id }}">
            {% include "editor/loadingAnimation.html" %}
            <!-- top bar -->
            <nav class="navbar navbar-dark bg-dark px-3 flex-shrink-0">
                <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'projects' %}">
                    <img src="{% static 'img/logo_canvas.svg' %}" alt="CANVAS" height="24">
                </a>
                <span class="navbar-text text-light">{{ project_name }}</span>
                <div class="d-flex gap-3 text-light">
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="toggle-shadows" checked>
                        <label class="form-check-label" for="toggle-shadows">Shadows</label>
                    </div>
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="toggle-fog" checked>
                        <label class="form-check-label" for="toggle-fog">Fog</label>
                    </div>
                </div>
            </nav>
            <!-- main editor pane -->
            <main class="editor-main">
                <div id="canvas">
                    <div id="placement"></div>
                </div>
                <aside class="editor-sidebar bg-body-tertiary border-start">
                    <ul class="nav nav-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active"
                                    data-bs-toggle="tab"
                                    data-bs-target="#inspector-pane"
                                    type="button">Inspector</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link"
                                    data-bs-toggle="tab"
                                    data-bs-target="#overview-pane"
                                    type="button">Overview</button>
                        </li>
                    </ul>
                    <div class="tab-content p-2">
                        <div class="tab-pane fade show active" id="inspector-pane" role="tabpanel">
                            <div id="inspector" class="d-flex flex-column gap-2"></div>
                        </div>
                        <div class="tab-pane fade" id="overview-pane" role="tabpanel">
                            <div id="overview" class="list-group"></div>
                        </div>
                    </div>
                </aside>
            </main>
        </div>
    </body>
</html>
